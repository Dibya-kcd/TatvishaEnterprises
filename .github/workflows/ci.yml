name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run Lint
      run: npm run lint

    - name: Build App
      run: npm run build
      env:
        # Mocking variables for build time if needed
        VITE_SUPABASE_URL: "https://placeholder.supabase.co"
        VITE_SUPABASE_ANON_KEY: "placeholder"
